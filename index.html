<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">todolist待办事项 v1</h1>
      <p class="app__subtitle">添加任务，完成后勾选或删除</p>
    </header>

    <form class="todo-form" id="todo-form" autocomplete="off">
      <label class="visually-hidden" for="todo-input">新任务</label>
      <input
        type="text"
        id="todo-input"
        class="todo-form__input"
        placeholder="输入任务内容，按 Enter 添加"
        maxlength="500"
        required
      />
      <button type="submit" class="todo-form__submit">添加</button>
    </form>

    <nav class="filters" aria-label="筛选">
      <button type="button" class="filters__btn filters__btn--active" data-filter="all">全部</button>
      <button type="button" class="filters__btn" data-filter="active">未完成</button>
      <button type="button" class="filters__btn" data-filter="completed">已完成</button>
    </nav>

    <ul class="todo-list" id="todo-list" role="list"></ul>

    <footer class="app__footer">
      <span class="app__count" id="todo-count" aria-live="polite"></span>
      <button type="button" class="app__clear" id="clear-completed" hidden>清除已完成</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
